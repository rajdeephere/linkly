spring:
  application:
    name: linkly-api

  datasource:
    # Host port 5433 (see infra/docker-compose.yml) avoids clashing with a native Postgres on 5432.
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5433/linkly}
    username: ${POSTGRES_USER:linkly}
    password: ${POSTGRES_PASSWORD:linkly}

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only validates the entities match it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Don't let an unreachable broker stall the (async) emit for long.
        max.block.ms: 2000
    consumer:
      group-id: linkly-analytics
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.linkly.analytics.ClickEventMessage
        spring.json.trusted.packages: com.linkly.analytics

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  # 8081 keeps clear of Kafka UI (8080) and the Next.js web app (3000)
  port: 8081

linkly:
  # Short-URL base = the public edge entry (Next.js middleware on :3000). In prod this is the
  # branded/short domain fronted by the edge. (The api itself no longer serves redirects.)
  base-url: ${LINKLY_BASE_URL:http://localhost:3000}
  rate-limit:
    create-per-minute: ${LINKLY_RATE_LIMIT_CREATE_PER_MINUTE:20}
  safe-browsing:
    # false → StubUrlSafetyChecker (offline blocklist). true → real Google Safe Browsing (needs a key).
    enabled: ${LINKLY_SAFE_BROWSING_ENABLED:false}
  jwt:
    # Base64 HS256 key (dev-only fallback). In prod: a secrets manager, never the repo.
    secret: ${LINKLY_JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Ng==}
    expiry-minutes: ${LINKLY_JWT_EXPIRY_MINUTES:60}
